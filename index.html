<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUMP // LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center">

  <div class="w-full max-w-md bg-slate-900 border-x border-slate-800 flex flex-col min-h-screen relative pb-28">
    
    <!-- Header App -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 sticky top-0 z-10 backdrop-blur">
      <h1 class="text-xl font-extrabold tracking-wider text-emerald-400">PUMP // LAB</h1>
      <span id="routine-tag" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-mono">SUPERSERIE</span>
    </header>

    <main class="flex-1 p-4 flex flex-col justify-between">

      <!-- SCHERMATA 1: HOME -->
      <div id="screen-home" class="flex-1 flex flex-col items-center justify-center py-12 space-y-6">
        <button onclick="startWorkout()" class="w-64 h-64 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-3xl tracking-widest shadow-2xl shadow-emerald-500/20 active:scale-95 transition flex items-center justify-center text-center p-4">
          ALLENIAMOCI
        </button>
        <p class="text-xs text-slate-400 font-mono">Superserie in pagina unica & EMOM automatico</p>
      </div>

      <!-- SCHERMATA 2: EXECUTION WORKOUT -->
      <div id="screen-workout" class="hidden space-y-4 flex-1 flex flex-col justify-between">
        
        <div class="space-y-4 overflow-y-auto max-h-[calc(100vh-220px)] pr-1">
          <!-- 1. NUMERO BLOCCO E GIRO (HIGH VISIBILITY BADGE) -->
          <div class="border-b border-slate-800 pb-3 flex justify-between items-center gap-2">
            <span id="block-number" class="text-xs font-mono font-black text-slate-300 uppercase tracking-wider">BLOCCO 1 DE 6</span>
            <span id="set-counter" class="text-sm font-black bg-emerald-400 text-slate-950 px-3 py-1.5 rounded-xl shadow-md tracking-wide">GIRO 1 DI 3</span>
          </div>

          <!-- 2. TIMER DISPLAY -->
          <div id="timer-box" class="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-center space-y-1">
            <span id="timer-label" class="text-3xs font-mono text-slate-400 uppercase tracking-widest">PRONTO</span>
            <div id="timer-display" class="text-5xl font-black font-mono text-slate-200">00:00</div>
          </div>

          <!-- 3. CONTENITORE DINAMICO ESERCIZI DEL BLOCCO -->
          <div id="exercises-list" class="space-y-4"></div>
        </div>

        <!-- 4. PULSANTE PRINCIPALE -->
        <div class="pt-2 sticky bottom-14 z-20 bg-slate-900/90 backdrop-blur pb-1">
          <button id="main-action-btn" onclick="handleMainAction()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider">
            VIA
          </button>
        </div>

      </div>

      <!-- SCHERMATA 3: FINE WORKOUT & CHAT -->
      <div id="screen-summary" class="hidden space-y-4 py-6">
        <h2 class="font-black text-2xl text-emerald-400 text-center">SESSIONE COMPLETATA! 🎉</h2>
        
        <div class="p-4 bg-slate-800/40 border border-slate-800 rounded-2xl space-y-2">
          <label class="text-xs font-bold text-slate-300 uppercase">Note Allenamento:</label>
          <textarea id="workout-notes" placeholder="Sensazioni, fatica..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white outline-none h-20 focus:border-emerald-500"></textarea>
        </div>

        <button onclick="finishWorkoutAndSend()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base rounded-xl">
          💾 SALVA SU GOOGLE SHEETS & IA
        </button>

        <div id="ai-chat-box" class="hidden space-y-3 pt-2">
          <div class="p-4 bg-slate-900 border border-emerald-500/30 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="font-bold text-xs text-emerald-400">🤖 GEMINI COACH IA</span>
              <span id="chat-status" class="text-3xs text-slate-400">In ascolto...</span>
            </div>
            <div id="chat-messages" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-200"></div>
            <div class="flex gap-2 pt-2">
              <input type="text" id="chat-input" placeholder="Chiedi al coach..." class="flex-1 bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs text-white outline-none focus:border-emerald-500">
              <button onclick="sendChatMessage()" class="px-3 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Invia</button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- FRECCE DI NAVIGAZIONE IN CALCE -->
    <footer id="footer-nav" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 p-3 flex justify-between items-center backdrop-blur z-30">
      <button onclick="prevStep()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1">
        ← Precedente
      </button>
      <button onclick="nextStep()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1">
        Successivo →
      </button>
    </footer>

  </div>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw0ZXoojbXZmem0FApJ-q8kNB0C61bzxH4eb56WEgUcD3HiwNvudu_vc5ahiZB7joOk/exec"; 
    const GEMINI_API_KEY = "INCOLLA_QUI_LA_TUA_GEMINI_API_KEY";

    function parseYouTubeEmbedUrl(url, autoplay = false) {
      if (!url || url.trim() === "") return "";
      let videoId = "";
      try {
        if (url.includes("youtu.be/")) {
          videoId = url.split("youtu.be/")[1].split("?")[0].split("&")[0];
        } else if (url.includes("youtube.com/watch")) {
          const urlParams = new URLSearchParams(url.split("?")[1]);
          videoId = urlParams.get("v");
        } else if (url.includes("youtube.com/embed/")) {
          videoId = url.split("youtube.com/embed/")[1].split("?")[0];
        }
      } catch (e) { return ""; }
      return videoId ? `https://www.youtube.com/embed/${videoId}${autoplay ? '?autoplay=1' : ''}` : "";
    }

    // DEFINIZIONE BLOCCHI DI ALLENAMENTO
    const workoutBlocks = [
      {
        id: 1,
        title: "BLOCCO 1: SUPERSERIE 1",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "1. Skip ginocchia alte", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/-KmKv52IvXc?si=_Z7VsEkombf7Ey35" },
          { name: "1. Squat rana", target: "10-14 reps", isTimer: false, videoUrl: "https://youtu.be/-KmKv52IvXc?si=D3qCRADwSVcO1u4S" },
          { name: "1. Montagna -> Stretching del mondo", target: "3-5 per lato", isTimer: false, videoUrl: "https://youtu.be/MfpvCWi85LE?si=5e927jxQltIEFxwy" }
        ]
      },
      {
        id: 2,
        title: "BLOCCO 2: SUPERSERIE 2",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "2. Jumping Jacks", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/Vfg_vxxAwIU?si=Dfiad4AviIDBs_50" },
          { name: "2. Affondi alternati indietro", target: "8-16 per lato", isTimer: false, videoUrl: "https://youtu.be/Yqd9cPs3Z3E?si=fLScoIwPJqi7tPnV" },
          { name: "2. Piegamenti stretti / Thruster", target: "5-9 reps", isTimer: false, videoUrl: "https://youtu.be/cuQM0ETk2E8?si=8jcGRu_tiBkT8vH6" },
          { name: "2. Crunch gambe tese", target: "15-25 reps", isTimer: false, videoUrl: "https://youtu.be/AMku5hdoLoM?si=yXi1OnanY0hneOTJ" }
        ]
      },
      {
        id: 3,
        title: "BLOCCO 3: CHALLENGE MOBY",
        totalSets: 1,
        restAfterSet: 90,
        exercises: [
          { 
            name: "3. Squat: Moby - Flower", target: "1 volta (Bring Sally Up)", isTimer: false, 
            videoUrl: "https://youtu.be/6A2V9Bu80J4?si=zNy6BcOgIki9Z0O-", 
            secondaryVideoUrl: "https://youtu.be/XQLmIWrDPnc?si=iE8nixKUqVCcUQuo", 
            autoplay: true,
            note: "🎵 CANZONE IN ALTO: 'Bring Sally Down' -> Scendi | 'Bring Sally Up' -> Sali.\n🎥 TUTORIAL TECNICO IN BASSO." 
          }
        ]
      },
      {
        id: 4,
        title: "BLOCCO 4: SUPERSERIE 3",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "4. Mountain climber", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/2YFqDhghiSI?si=lRGdudbHfR1VYKdX" },
          { name: "4. Rematore", target: "10-15 reps", isTimer: false, videoUrl: "https://youtu.be/H9ikfHG-hVw?si=t-wgS9dAeEtYeOxi" },
          { name: "4. Criss Cross", target: "6-10 per lato", isTimer: false, videoUrl: "https://youtu.be/SV4GrHcginQ?si=R33Y1yxleYWYEIzQ" }
        ]
      },
      {
        id: 5,
        title: "BLOCCO 5: EMOM PIEGAMENTI",
        totalSets: 10,
        isEmom: true,
        restAfterSet: 0,
        exercises: [
          { 
            name: "5. Piegamenti braccia - EMOM", target: "3-4 reps/min (Ogni minuto per 10')", isTimer: true, workTime: 60, 
            videoUrl: "https://youtu.be/mSGhSN6DgnA?si=4vZss6eZCc_XKm8t",
            note: "EMOM: Fai 3-4 rep all'inizio di ogni minuto. Il timer riparte da solo 10 volte consecutivamente!" 
          }
        ]
      },
      {
        id: 6,
        title: "BLOCCO 6: STRETCHING",
        totalSets: 3,
        restAfterSet: 60,
        exercises: [
          { name: "6. Stretching: Cane basso (Downward Dog)", target: "10'' tenuta", isTimer: false, videoUrl: "https://youtu.be/mSGhSN6DgnA?si=4vZss6eZCc_XKm8t" },
          { name: "6. Stretching: Cane alto (Upward Dog)", target: "10'' tenuta", isTimer: false, videoUrl: "https://youtu.be/kMXLAK7BAWk?si=YRKXLASpDMcPLVyK" }
        ]
      }
    ];

    let currentBlockIndex = 0;
    let currentSetIndex = 1;
    let mainTimer = null;
    let audioCtx = null;
    let state = "IDLE"; // IDLE, WORKING, RESTING

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 600, duration = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playTripleBeep() {
      playBeep(900, 0.15);
      setTimeout(() => playBeep(900, 0.15), 200);
      setTimeout(() => playBeep(1200, 0.3), 400);
    }

    function startWorkout() {
      initAudio();
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-workout').classList.remove('hidden');
      document.getElementById('footer-nav').classList.remove('hidden');
      currentBlockIndex = 0;
      currentSetIndex = 1;
      loadBlock();
    }

    function loadBlock() {
      clearInterval(mainTimer);
      state = "IDLE";
      const block = workoutBlocks[currentBlockIndex];

      document.getElementById('block-number').textContent = `${block.title}`;
      document.getElementById('set-counter').textContent = `GIRO ${currentSetIndex} DI ${block.totalSets}`;

      const listContainer = document.getElementById('exercises-list');
      listContainer.innerHTML = "";

      // Genera la lista degli esercizi con font ad alta leggibilità
      block.exercises.forEach((ex) => {
        const embedUrl = parseYouTubeEmbedUrl(ex.videoUrl, ex.autoplay || false);
        const secEmbedUrl = parseYouTubeEmbedUrl(ex.secondaryVideoUrl, false);

        let html = `
          <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3 shadow-md">
            <div>
              <h3 class="font-extrabold text-white text-lg tracking-wide">${ex.name}</h3>
              <p class="text-base font-black text-amber-300 mt-1 uppercase tracking-wider bg-slate-900/80 px-3 py-1 rounded-lg inline-block border border-slate-800">${ex.target}</p>
              ${ex.note ? `<p class="text-xs text-amber-400/90 italic mt-2 leading-relaxed bg-amber-500/10 p-2 rounded-lg border border-amber-500/20">${ex.note}</p>` : ''}
            </div>
            
            ${embedUrl ? `
              <div class="aspect-video w-full max-h-44 bg-slate-900 rounded-xl overflow-hidden border border-slate-800">
                <iframe class="w-full h-full" src="${embedUrl}" title="${ex.name}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            ` : ''}

            ${secEmbedUrl ? `
              <div class="aspect-video w-full max-h-44 bg-slate-900 rounded-xl overflow-hidden border border-slate-800 mt-2">
                <iframe class="w-full h-full" src="${secEmbedUrl}" title="Tutorial Tecnico" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            ` : ''}
          </div>
        `;
        listContainer.innerHTML += html;
      });

      // Reset Display & Bottone VIA
      const firstTimerEx = block.exercises.find(e => e.isTimer);
      const timerDisplay = document.getElementById('timer-display');
      const timerLabel = document.getElementById('timer-label');
      const actionBtn = document.getElementById('main-action-btn');

      timerDisplay.className = "text-5xl font-black font-mono text-slate-200";
      timerLabel.textContent = "PRONTO";
      
      if (firstTimerEx) {
        timerDisplay.textContent = formatTime(firstTimerEx.workTime);
      } else {
        timerDisplay.textContent = "00:00";
      }

      actionBtn.textContent = "VIA";
      actionBtn.className = "w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider";
    }

    function handleMainAction() {
      initAudio();
      const block = workoutBlocks[currentBlockIndex];
      const timerEx = block.exercises.find(e => e.isTimer);

      if (state === "IDLE") {
        if (block.isEmom) {
          startEmomTimer(60);
        } else if (timerEx) {
          startWorkTimer(timerEx.workTime);
        } else {
          state = "WORKING";
          const actionBtn = document.getElementById('main-action-btn');
          actionBtn.textContent = "FATTO (INIZIA RIPOSO)";
          actionBtn.className = "w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg uppercase tracking-wider";
        }
      } 
      else if (state === "WORKING") {
        if (block.restAfterSet > 0) {
          startRestTimer(block.restAfterSet);
        } else {
          advanceWorkout();
        }
      }
    }

    function startWorkTimer(seconds) {
      state = "WORKING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "TEMPO ESERCIZIO IN CORSO";
      display.className = "text-5xl font-black font-mono text-red-500 animate-pulse";
      btn.textContent = "FATTO (COMPLETA GIRO)";
      btn.className = "w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(700, 0.12);
        
        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          label.textContent = "TEMPO ESERCIZIO CONCLUSO - COMPLETA GLI ALTRI";
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function startEmomTimer(seconds) {
      state = "WORKING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = `EMOM: MINUTO ${currentSetIndex} DI 10`;
      display.className = "text-5xl font-black font-mono text-red-500 animate-pulse";
      btn.textContent = "IN ESECUZIONE EMOM...";
      btn.className = "w-full py-4 bg-slate-800 text-slate-500 font-black text-xl rounded-2xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(800, 0.12);
        
        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          
          if (currentSetIndex < 10) {
            currentSetIndex++;
            document.getElementById('set-counter').textContent = `GIRO ${currentSetIndex} DI 10`;
            startEmomTimer(60);
          } else {
            advanceWorkout();
          }
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function startRestTimer(seconds) {
      state = "RESTING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "RECUPERO SUPERSERIE";
      display.className = "text-5xl font-black font-mono text-emerald-400";
      btn.textContent = "RIPOSO IN CORSO...";
      btn.className = "w-full py-4 bg-slate-800 text-slate-500 font-black text-xl rounded-2xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(600, 0.12);

        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          advanceWorkout();
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function advanceWorkout() {
      const block = workoutBlocks[currentBlockIndex];

      if (currentSetIndex < block.totalSets) {
        currentSetIndex++;
        loadBlock();
      } else {
        if (currentBlockIndex < workoutBlocks.length - 1) {
          currentBlockIndex++;
          currentSetIndex = 1;
          loadBlock();
        } else {
          document.getElementById('screen-workout').classList.add('hidden');
          document.getElementById('footer-nav').classList.add('hidden');
          document.getElementById('screen-summary').classList.remove('hidden');
        }
      }
    }

    function nextStep() {
      advanceWorkout();
    }

    function prevStep() {
      if (currentSetIndex > 1) {
        currentSetIndex--;
        loadBlock();
      } else if (currentBlockIndex > 0) {
        currentBlockIndex--;
        currentSetIndex = workoutBlocks[currentBlockIndex].totalSets;
        loadBlock();
      }
    }

    function formatTime(sec) {
      let m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function finishWorkoutAndSend() {
      const notes = document.getElementById('workout-notes').value;

      if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("http")) {
        fetch(GOOGLE_SHEET_URL, {
          method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ action: "FINISH", routine: "CHALLENGE_SUPERSERIE", notes: notes })
        }).catch(err => console.log(err));
      }

      document.getElementById('ai-chat-box').classList.remove('hidden');
      initAIChat(notes);
    }

    async function initAIChat(notes) {
      const prompt = `Ho appena completato la scheda Challenge in superserie. Note: ${notes || "Nessuna"}. Proponi aggiustamenti per la prossima volta.`;
      addChatMessage("IA", "Sto analizzando l'allenamento...");
      callGemini(prompt);
    }

    async function callGemini(userText) {
      const statusEl = document.getElementById('chat-status');
      statusEl.textContent = "Gemini sta pensando...";

      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("INCOLLA")) {
        statusEl.textContent = "Chiave Mancante";
        addChatMessage("IA", "⚠️ Inserisci la tua GEMINI_API_KEY per abilitare la chat.");
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: userText }] }] })
        });
        const data = await response.json();
        const aiReply = data.candidates[0].content.parts[0].text;
        statusEl.textContent = "In ascolto...";
        addChatMessage("IA", aiReply);
      } catch (e) {
        statusEl.textContent = "Errore Connessione";
        addChatMessage("IA", "❌ Errore di connessione con Gemini.");
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      addChatMessage("TU", text);
      input.value = "";
      callGemini(text);
    }

    function addChatMessage(sender, text) {
      const box = document.getElementById('chat-messages');
      const isUser = sender === "TU";
      box.innerHTML += `
        <div class="p-2.5 rounded-xl text-xs ${isUser ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 self-end ml-4' : 'bg-slate-800 text-slate-200 mr-4'}">
          <strong>${sender}:</strong> <span class="whitespace-pre-line">${text}</span>
        </div>
      `;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
