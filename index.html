<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUMP // LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center overflow-hidden">

  <div class="w-full max-w-md bg-slate-900 border-x border-slate-800 flex flex-col h-screen relative pb-16">
    
    <!-- Header App -->
    <header class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 shrink-0">
      <h1 class="text-lg font-extrabold tracking-wider text-emerald-400">PUMP // LAB</h1>
      <span id="routine-tag" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full font-mono">SUPERSERIE</span>
    </header>

    <main class="flex-1 p-3 flex flex-col justify-between overflow-hidden">

      <!-- SCHERMATA 1: HOME -->
      <div id="screen-home" class="flex-1 flex flex-col items-center justify-center py-6 space-y-6">
        <button onclick="startWorkout()" class="w-56 h-56 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-2xl tracking-widest shadow-2xl shadow-emerald-500/20 active:scale-95 transition flex items-center justify-center text-center p-4">
          ALLENIAMOCI
        </button>
        <p class="text-xs text-slate-400 font-mono">EMOM personalizzabile & Stretching unificato</p>
      </div>

      <!-- SCHERMATA 2: EXECUTION WORKOUT -->
      <div id="screen-workout" class="hidden flex-1 flex flex-col justify-between space-y-2 overflow-hidden">
        
        <!-- BADGE BLOCCO E GIRO -->
        <div class="border-b border-slate-800 pb-2 flex justify-between items-center shrink-0">
          <span id="block-number" class="text-xs font-mono font-black text-slate-300 uppercase tracking-wider">BLOCCO 1 DE 6</span>
          <span id="set-counter" class="text-base font-black bg-emerald-400 text-slate-950 px-3 py-1 rounded-xl shadow-lg tracking-wide border border-emerald-300">GIRO 1 DI 3</span>
        </div>

        <!-- 1. TIMER DISPLAY -->
        <div id="timer-box" class="py-3 px-4 bg-slate-950 rounded-2xl border-2 border-slate-800 text-center space-y-1 shrink-0 shadow-2xl">
          <span id="timer-label" class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest">PRONTO</span>
          <div id="timer-display" class="text-6xl font-black font-mono text-slate-100 tracking-tight">00:00</div>
        </div>

        <!-- BOX TARGET EMOM GIGANTE E SUPER VISIBILE -->
        <div id="emom-target-banner" class="hidden py-2 px-3 bg-amber-500 text-slate-950 rounded-xl text-center border-2 border-amber-300 shadow-xl">
          <span class="text-3xs font-black uppercase tracking-widest text-slate-900 block">OBIETTIVO MINUTO CORRENTE</span>
          <div id="emom-reps-count" class="text-3xl font-black tracking-tight">5 FLESSIONI</div>
        </div>

        <!-- SELETTORE REPS INIZIALI EMOM (4, 5, 6, 7) -->
        <div id="emom-selector-box" class="hidden bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex flex-col items-center space-y-1.5 shrink-0">
          <span class="text-4xs font-mono font-extrabold text-amber-300 uppercase tracking-wider">SELEZIONA FLESSIONI DI PARTENZA (GIRO 1-2):</span>
          <div class="flex gap-2 w-full justify-center">
            <button onclick="setEmomStartReps(4)" id="btn-reps-4" class="emom-rep-btn flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-black text-sm rounded-lg border border-slate-700">4</button>
            <button onclick="setEmomStartReps(5)" id="btn-reps-5" class="emom-rep-btn flex-1 py-1.5 bg-amber-500 text-slate-950 font-black text-sm rounded-lg border border-amber-400">5</button>
            <button onclick="setEmomStartReps(6)" id="btn-reps-6" class="emom-rep-btn flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-black text-sm rounded-lg border border-slate-700">6</button>
            <button onclick="setEmomStartReps(7)" id="btn-reps-7" class="emom-rep-btn flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-black text-sm rounded-lg border border-slate-700">7</button>
          </div>
        </div>

        <!-- 2. PULSANTE PRINCIPALE -->
        <div class="shrink-0">
          <button id="main-action-btn" onclick="handleMainAction()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider">
            VIA
          </button>
        </div>

        <!-- 3. CONTENITORE ESERCIZI DEL BLOCCO -->
        <div id="exercises-list" class="flex-1 flex flex-col justify-center gap-2 overflow-y-auto py-1"></div>

      </div>

      <!-- SCHERMATA 3: FINE WORKOUT & CHAT -->
      <div id="screen-summary" class="hidden space-y-4 py-4 overflow-y-auto">
        <h2 class="font-black text-xl text-emerald-400 text-center">SESSIONE COMPLETATA! 🎉</h2>
        
        <div class="p-3 bg-slate-800/40 border border-slate-800 rounded-xl space-y-1">
          <label class="text-xs font-bold text-slate-300 uppercase">Note Allenamento:</label>
          <textarea id="workout-notes" placeholder="Sensazioni, fatica..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white outline-none h-16 focus:border-emerald-500"></textarea>
        </div>

        <button onclick="finishWorkoutAndSend()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm rounded-xl">
          💾 SALVA SU GOOGLE SHEETS & IA
        </button>

        <div id="ai-chat-box" class="hidden space-y-2 pt-1">
          <div class="p-3 bg-slate-900 border border-emerald-500/30 rounded-xl space-y-2">
            <div class="flex justify-between items-center border-b border-slate-800 pb-1">
              <span class="font-bold text-xs text-emerald-400">🤖 GEMINI COACH IA</span>
              <span id="chat-status" class="text-4xs text-slate-400">In ascolto...</span>
            </div>
            <div id="chat-messages" class="space-y-1.5 max-h-48 overflow-y-auto text-xs text-slate-200"></div>
            <div class="flex gap-2 pt-1">
              <input type="text" id="chat-input" placeholder="Chiedi al coach..." class="flex-1 bg-slate-800 p-2 rounded-lg border border-slate-700 text-xs text-white outline-none focus:border-emerald-500">
              <button onclick="sendChatMessage()" class="px-3 bg-emerald-500 text-slate-950 font-bold rounded-lg text-xs">Invia</button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- MODAL / POP-UP VIDEO A TUTTO SCHERMO -->
    <div id="video-modal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur flex flex-col justify-center items-center p-4">
      <div class="w-full max-w-lg flex justify-between items-center pb-2">
        <h3 id="modal-video-title" class="text-xs font-bold text-white truncate">Tutorial Video</h3>
        <button onclick="closeVideoModal()" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white font-black text-xs rounded-lg uppercase">
          ✕ Chiudi
        </button>
      </div>
      <div class="w-full aspect-video bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-2xl">
        <iframe id="modal-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>

    <!-- FRECCE DI NAVIGAZIONE IN CALCE -->
    <footer id="footer-nav" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 p-2.5 flex justify-between items-center backdrop-blur z-30">
      <button onclick="prevStep()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg flex items-center gap-1">
        ← Precedente
      </button>
      <button onclick="nextStep()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg flex items-center gap-1">
        Successivo →
      </button>
    </footer>

  </div>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw0ZXoojbXZmem0FApJ-q8kNB0C61bzxH4eb56WEgUcD3HiwNvudu_vc5ahiZB7joOk/exec"; 
    const GEMINI_API_KEY = "INCOLLA_QUI_LA_TUA_GEMINI_API_KEY";

    function parseYouTubeEmbedUrl(url, autoplay = false) {
      if (!url || url.trim() === "") return "";
      let videoId = "";
      try {
        if (url.includes("youtu.be/")) {
          videoId = url.split("youtu.be/")[1].split("?")[0].split("&")[0];
        } else if (url.includes("youtube.com/watch")) {
          const urlParams = new URLSearchParams(url.split("?")[1]);
          videoId = urlParams.get("v");
        } else if (url.includes("youtube.com/embed/")) {
          videoId = url.split("youtube.com/embed/")[1].split("?")[0];
        }
      } catch (e) { return ""; }
      return videoId ? `https://www.youtube.com/embed/${videoId}?enablejsapi=1${autoplay ? '&autoplay=1&mute=0' : ''}` : "";
    }

    const workoutBlocks = [
      {
        id: 1,
        title: "BLOCCO 1: SUPERSERIE 1",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "1. Skip ginocchia alte", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/-KmKv52IvXc?si=_Z7VsEkombf7Ey35" },
          { name: "1. Squat rana", target: "10-14 reps", isTimer: false, videoUrl: "https://youtu.be/-KmKv52IvXc?si=D3qCRADwSVcO1u4S" },
          { name: "1. Montagna", target: "3-5 per lato", isTimer: false, videoUrl: "https://youtu.be/MfpvCWi85LE?si=5e927jxQltIEFxwy" }
        ]
      },
      {
        id: 2,
        title: "BLOCCO 2: SUPERSERIE 2",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "2. Jumping Jacks", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/Vfg_vxxAwIU?si=Dfiad4AviIDBs_50" },
          { name: "2. Affondi alternati indietro", target: "8-16 per lato", isTimer: false, videoUrl: "https://youtu.be/Yqd9cPs3Z3E?si=fLScoIwPJqi7tPnV" },
          { name: "2. Piegamenti stretti", target: "5-9 reps", isTimer: false, videoUrl: "https://youtu.be/cuQM0ETk2E8?si=8jcGRu_tiBkT8vH6" },
          { name: "2. Crunch gambe tese", target: "15-25 reps", isTimer: false, videoUrl: "https://youtu.be/AMku5hdoLoM?si=yXi1OnanY0hneOTJ" }
        ]
      },
      {
        id: 3,
        title: "BLOCCO 3: CHALLENGE MOBY",
        totalSets: 1,
        restAfterSet: 90,
        isMobyBlock: true,
        exercises: [
          { 
            name: "3. Squat: Moby - Flower", target: "1 volta (Bring Sally Up)", isTimer: false, 
            videoUrl: "https://youtu.be/6A2V9Bu80J4?si=zNy6BcOgIki9Z0O-", 
            secondaryVideoUrl: "https://youtu.be/XQLmIWrDPnc?si=iE8nixKUqVCcUQuo", 
            autoplay: true,
            note: "🎵 CANZONE: 'Bring Sally Down' -> Scendi | 'Bring Sally Up' -> Sali." 
          }
        ]
      },
      {
        id: 4,
        title: "BLOCCO 4: SUPERSERIE 3",
        totalSets: 3,
        restAfterSet: 90,
        exercises: [
          { name: "4. Mountain climber", target: "1'", isTimer: true, workTime: 60, videoUrl: "https://youtu.be/2YFqDhghiSI?si=lRGdudbHfR1VYKdX" },
          { name: "4. Rematore", target: "10-15 reps", isTimer: false, videoUrl: "https://youtu.be/H9ikfHG-hVw?si=t-wgS9dAeEtYeOxi" },
          { name: "4. Criss Cross", target: "6-10 per lato", isTimer: false, videoUrl: "https://youtu.be/SV4GrHcginQ?si=R33Y1yxleYWYEIzQ" }
        ]
      },
      {
        id: 5,
        title: "BLOCCO 5: EMOM PIEGAMENTI",
        totalSets: 10,
        isEmom: true,
        restAfterSet: 90,
        exercises: [
          { 
            name: "5. Piegamenti braccia - EMOM", target: "PROGRESSIVO (+1 ogni 2 giri)", isTimer: true, workTime: 60, 
            videoUrl: "https://youtu.be/mSGhSN6DgnA?si=4vZss6eZCc_XKm8t",
            note: "EMOM AUTOMATICO: +1 rep ogni 2 giri per 10 minuti." 
          }
        ]
      },
      {
        id: 6,
        title: "BLOCCO 6: STRETCHING COMPLETO",
        totalSets: 1,
        isStretching: true,
        exercises: [
          { name: "6. Stretching: Cane Basso + Cane Alto", target: "6 Tenute x 10'' (senza defaticamento intermedio)", isTimer: true, videoUrl: "https://youtu.be/mSGhSN6DgnA?si=4vZss6eZCc_XKm8t" }
        ]
      }
    ];

    let currentBlockIndex = 0;
    let currentSetIndex = 1;
    let emomStartReps = 5; 
    let mainTimer = null;
    let audioCtx = null;
    let state = "IDLE"; 

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 600, duration = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playTripleBeep() {
      playBeep(900, 0.15);
      setTimeout(() => playBeep(900, 0.15), 200);
      setTimeout(() => playBeep(1200, 0.3), 400);
    }

    function startWorkout() {
      initAudio();
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-workout').classList.remove('hidden');
      document.getElementById('footer-nav').classList.remove('hidden');
      currentBlockIndex = 0;
      currentSetIndex = 1;
      loadBlock();
    }

    function setEmomStartReps(reps) {
      emomStartReps = reps;
      [4, 5, 6, 7].forEach(r => {
        const btn = document.getElementById(`btn-reps-${r}`);
        if (btn) {
          if (r === reps) {
            btn.className = "emom-rep-btn flex-1 py-1.5 bg-amber-500 text-slate-950 font-black text-sm rounded-lg border border-amber-400";
          } else {
            btn.className = "emom-rep-btn flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-black text-sm rounded-lg border border-slate-700";
          }
        }
      });
      document.getElementById('emom-reps-count').textContent = `${reps} FLESSIONI`;
    }

    function loadBlock() {
      clearInterval(mainTimer);
      state = "IDLE";
      const block = workoutBlocks[currentBlockIndex];

      document.getElementById('block-number').textContent = `${block.title}`;
      document.getElementById('set-counter').textContent = `GIRO ${currentSetIndex} DI ${block.totalSets}`;

      const targetBanner = document.getElementById('emom-target-banner');
      const selectorBox = document.getElementById('emom-selector-box');

      if (block.isEmom) {
        targetBanner.classList.remove('hidden');
        selectorBox.classList.remove('hidden');
        document.getElementById('emom-reps-count').textContent = `${emomStartReps} FLESSIONI`;
      } else {
        targetBanner.classList.add('hidden');
        selectorBox.classList.add('hidden');
      }

      const listContainer = document.getElementById('exercises-list');
      listContainer.innerHTML = "";

      block.exercises.forEach((ex) => {
        let html = "";

        if (block.isMobyBlock) {
          const mainEmbed = parseYouTubeEmbedUrl(ex.videoUrl, true);
          html = `
            <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2 shadow-sm">
              <div class="flex justify-between items-center">
                <h3 class="font-black text-white text-base tracking-wide">${ex.name}</h3>
                ${ex.secondaryVideoUrl ? `
                  <button onclick="openVideoModal('${ex.name} (Tecnica)', '${ex.secondaryVideoUrl}')" class="px-2.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-black flex items-center gap-1">
                    ▶ Tecnica
                  </button>
                ` : ''}
              </div>
              <div>
                <span class="text-base font-black text-amber-300 uppercase bg-amber-500/20 px-3 py-1 rounded-xl border border-amber-400/50 inline-block tracking-wider shadow-md">${ex.target}</span>
              </div>
              ${ex.note ? `<p class="text-3xs text-amber-400/90 italic font-semibold">${ex.note}</p>` : ''}
              <div class="aspect-video w-full bg-slate-900 rounded-xl overflow-hidden border border-slate-800 shadow-md">
                <iframe class="w-full h-full" src="${mainEmbed}" title="${ex.name}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            </div>
          `;
        } else {
          html = `
            <div class="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between gap-2 shadow-sm">
              <div class="min-w-0 flex-1 space-y-1">
                <h3 class="font-black text-white text-sm truncate tracking-wide">${ex.name}</h3>
                <div class="flex items-center gap-2">
                  <span class="text-base font-black text-amber-300 bg-amber-500/20 px-3 py-1 rounded-xl border border-amber-400/50 shadow-md tracking-wider inline-block">${ex.target}</span>
                  ${ex.note ? `<span class="text-4xs text-amber-400/90 italic truncate">${ex.note}</span>` : ''}
                </div>
              </div>
              
              <div class="flex gap-1 shrink-0">
                ${ex.videoUrl ? `
                  <button onclick="openVideoModal('${ex.name}', '${ex.videoUrl}')" class="px-3 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/40 rounded-xl text-base font-black flex items-center justify-center">
                    ▶
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        }

        listContainer.innerHTML += html;
      });

      const timerDisplay = document.getElementById('timer-display');
      const timerLabel = document.getElementById('timer-label');
      const actionBtn = document.getElementById('main-action-btn');

      timerDisplay.className = "text-6xl font-black font-mono text-slate-100 tracking-tight";
      timerLabel.textContent = "PRONTO";
      
      if (block.isStretching) {
        timerDisplay.textContent = "00:05";
      } else {
        const firstTimerEx = block.exercises.find(e => e.isTimer);
        timerDisplay.textContent = firstTimerEx ? formatTime(firstTimerEx.workTime) : "00:00";
      }

      actionBtn.textContent = "VIA";
      actionBtn.className = "w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider";
    }

    function openVideoModal(title, url) {
      const modal = document.getElementById('video-modal');
      const modalTitle = document.getElementById('modal-video-title');
      const modalIframe = document.getElementById('modal-iframe');

      modalTitle.textContent = title;
      modalIframe.src = parseYouTubeEmbedUrl(url, true);
      modal.classList.remove('hidden');
    }

    function closeVideoModal() {
      const modal = document.getElementById('video-modal');
      const modalIframe = document.getElementById('modal-iframe');
      modalIframe.src = "";
      modal.classList.add('hidden');
    }

    function handleMainAction() {
      initAudio();
      const block = workoutBlocks[currentBlockIndex];

      if (state === "IDLE") {
        if (block.isStretching) {
          startStretchingUnifiedSequence();
        } else if (block.isEmom) {
          document.getElementById('emom-selector-box').classList.add('hidden');
          startEmomTimer(60);
        } else {
          const timerEx = block.exercises.find(e => e.isTimer);
          if (timerEx) {
            startWorkTimer(timerEx.workTime);
          } else {
            state = "WORKING";
            const actionBtn = document.getElementById('main-action-btn');
            actionBtn.textContent = "FATTO (INIZIA RIPOSO)";
            actionBtn.className = "w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-xl transition shadow-lg uppercase tracking-wider";
          }
        }
      } 
      else if (state === "WORKING" && !block.isStretching && !block.isEmom) {
        if (block.restAfterSet > 0) {
          startRestTimer(block.restAfterSet);
        } else {
          advanceWorkout();
        }
      }
    }

    function startStretchingUnifiedSequence() {
      state = "WORKING";
      clearInterval(mainTimer);
      let prepTime = 5;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "PREPARATI ALLO STRETCHING (5s)";
      display.className = "text-6xl font-black font-mono text-amber-400 animate-pulse";
      btn.textContent = "IN ESECUZIONE STRETCHING...";
      btn.className = "w-full py-3.5 bg-slate-800 text-slate-500 font-black text-xl rounded-xl cursor-not-allowed uppercase tracking-wider";

      const updatePrep = () => {
        display.textContent = formatTime(prepTime);
        if (prepTime <= 3 && prepTime > 0) playBeep(600, 0.12);

        if (prepTime <= 0) {
          clearInterval(mainTimer);
          playBeep(900, 0.25);
          executeStretchStep(1);
        } else {
          prepTime--;
        }
      };

      updatePrep();
      mainTimer = setInterval(updatePrep, 1000);
    }

    function executeStretchStep(stepNum) {
      let exName = stepNum <= 3 ? "CANE BASSO" : "CANE ALTO";
      let exTenutaNum = stepNum <= 3 ? stepNum : stepNum - 3;

      clearInterval(mainTimer);
      let time = 10;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');

      label.textContent = `${exName}: TENUTA ${exTenutaNum} DI 3 (10s)`;
      display.className = "text-6xl font-black font-mono text-red-500 animate-pulse";

      const updateTenuta = () => {
        display.textContent = formatTime(time);
        if (time <= 3 && time > 0) playBeep(700, 0.12);

        if (time <= 0) {
          clearInterval(mainTimer);
          playBeep(900, 0.2);

          if (stepNum < 6) {
            startStretchPausaGeneric(5, () => executeStretchStep(stepNum + 1));
          } else {
            playTripleBeep();
            advanceWorkout();
          }
        } else {
          time--;
        }
      };

      updateTenuta();
      mainTimer = setInterval(updateTenuta, 1000);
    }

    function startStretchPausaGeneric(seconds, onComplete) {
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');

      label.textContent = `PAUSA / CAMBIO POSIZIONE (${seconds}s)`;
      display.className = "text-6xl font-black font-mono text-amber-400";

      const updatePausa = () => {
        display.textContent = formatTime(time);
        if (time <= 2 && time > 0) playBeep(600, 0.12);

        if (time <= 0) {
          clearInterval(mainTimer);
          playBeep(800, 0.2);
          onComplete();
        } else {
          time--;
        }
      };

      updatePausa();
      mainTimer = setInterval(updatePausa, 1000);
    }

    function startWorkTimer(seconds) {
      state = "WORKING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "TEMPO ESERCIZIO IN CORSO";
      display.className = "text-6xl font-black font-mono text-red-500 animate-pulse";
      btn.textContent = "FATTO (COMPLETA GIRO)";
      btn.className = "w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-xl transition shadow-lg uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(700, 0.12);
        
        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          label.textContent = "TEMPO ESERCIZIO CONCLUSO - COMPLETA GLI ALTRI";
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function startEmomTimer(seconds) {
      state = "WORKING";
      clearInterval(mainTimer);
      let time = seconds;

      let currentReps = emomStartReps + Math.floor((currentSetIndex - 1) / 2);

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');
      
      const targetBanner = document.getElementById('emom-target-banner');
      const repsCountEl = document.getElementById('emom-reps-count');

      targetBanner.classList.remove('hidden');
      repsCountEl.textContent = `${currentReps} FLESSIONI`;

      label.textContent = `EMOM: MINUTO ${currentSetIndex} DI 10`;
      display.className = "text-6xl font-black font-mono text-red-500 animate-pulse";
      btn.textContent = `EMOM AUTOMATICO IN CORSO...`;
      btn.className = "w-full py-3.5 bg-slate-800 text-amber-400 font-black text-xl rounded-xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(800, 0.12);
        
        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          
          if (currentSetIndex < 10) {
            currentSetIndex++;
            document.getElementById('set-counter').textContent = `GIRO ${currentSetIndex} DI 10`;
            startEmomTimer(60);
          } else {
            targetBanner.classList.add('hidden');
            startRestTimer(workoutBlocks[currentBlockIndex].restAfterSet || 90);
          }
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function startRestTimer(seconds) {
      state = "RESTING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "RECUPERO SUPERSERIE / DEFATICAMENTO";
      display.className = "text-6xl font-black font-mono text-emerald-400";
      btn.textContent = "RIPOSO IN CORSO...";
      btn.className = "w-full py-3.5 bg-slate-800 text-slate-500 font-black text-xl rounded-xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(600, 0.12);

        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          advanceWorkout();
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function advanceWorkout() {
      const block = workoutBlocks[currentBlockIndex];

      if (block.isStretching) {
        document.getElementById('screen-workout').classList.add('hidden');
        document.getElementById('footer-nav').classList.add('hidden');
        document.getElementById('screen-summary').classList.remove('hidden');
      } else {
        if (currentSetIndex < block.totalSets) {
          currentSetIndex++;
          loadBlock();
        } else {
          if (currentBlockIndex < workoutBlocks.length - 1) {
            currentBlockIndex++;
            currentSetIndex = 1;
            loadBlock();
          } else {
            document.getElementById('screen-workout').classList.add('hidden');
            document.getElementById('footer-nav').classList.add('hidden');
            document.getElementById('screen-summary').classList.remove('hidden');
          }
        }
      }
    }

    function nextStep() {
      advanceWorkout();
    }

    function prevStep() {
      if (currentSetIndex > 1) {
        currentSetIndex--;
        loadBlock();
      } else if (currentBlockIndex > 0) {
        currentBlockIndex--;
        currentSetIndex = workoutBlocks[currentBlockIndex].totalSets;
        loadBlock();
      }
    }

    function formatTime(sec) {
      let m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function finishWorkoutAndSend() {
      const notes = document.getElementById('workout-notes').value;

      if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("http")) {
        fetch(GOOGLE_SHEET_URL, {
          method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ action: "FINISH", routine: "CHALLENGE_SUPERSERIE", notes: notes })
        }).catch(err => console.log(err));
      }

      document.getElementById('ai-chat-box').classList.remove('hidden');
      initAIChat(notes);
    }

    async function initAIChat(notes) {
      const prompt = `Ho appena completato la scheda Challenge in superserie. Note: ${notes || "Nessuna"}. Proponi aggiustamenti per la prossima volta.`;
      addChatMessage("IA", "Sto analizzando l'allenamento...");
      callGemini(prompt);
    }

    async function callGemini(userText) {
      const statusEl = document.getElementById('chat-status');
      statusEl.textContent = "Gemini sta pensando...";

      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("INCOLLA")) {
        statusEl.textContent = "Chiave Mancante";
        addChatMessage("IA", "⚠️ Inserisci la tua GEMINI_API_KEY per abilitare la chat.");
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: userText }] }] })
        });
        const data = await response.json();
        const aiReply = data.candidates[0].content.parts[0].text;
        statusEl.textContent = "In ascolto...";
        addChatMessage("IA", aiReply);
      } catch (e) {
        statusEl.textContent = "Errore Connessione";
        addChatMessage("IA", "❌ Errore di connessione con Gemini.");
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      addChatMessage("TU", text);
      input.value = "";
      callGemini(text);
    }

    function addChatMessage(sender, text) {
      const box = document.getElementById('chat-messages');
      const isUser = sender === "TU";
      box.innerHTML += `
        <div class="p-2 rounded-xl text-xs ${isUser ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 self-end ml-4' : 'bg-slate-800 text-slate-200 mr-4'}">
          <strong>${sender}:</strong> <span class="whitespace-pre-line">${text}</span>
        </div>
      `;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
