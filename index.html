<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUMP // LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center">

  <div class="w-full max-w-md bg-slate-900 border-x border-slate-800 flex flex-col min-h-screen relative pb-16">
    
    <!-- Header App -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 sticky top-0 z-10 backdrop-blur">
      <h1 class="text-xl font-extrabold tracking-wider text-emerald-400">PUMP // LAB</h1>
      <span id="routine-tag" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-mono">CHALLENGE</span>
    </header>

    <main class="flex-1 p-4 flex flex-col justify-between">

      <!-- SCHERMATA 1: HOME -->
      <div id="screen-home" class="flex-1 flex flex-col items-center justify-center py-12 space-y-6">
        <button onclick="startWorkout()" class="w-64 h-64 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-3xl tracking-widest shadow-2xl shadow-emerald-500/20 active:scale-95 transition flex items-center justify-center text-center p-4">
          ALLENIAMOCI
        </button>
        <p class="text-xs text-slate-400 font-mono">Premi per iniziare la scheda</p>
      </div>

      <!-- SCHERMATA 2: EXECUTION WORKOUT -->
      <div id="screen-workout" class="hidden space-y-4 flex-1 flex flex-col justify-between">
        
        <div class="space-y-4">
          <!-- 1. NUMERO, NOME E DETTAGLI -->
          <div class="border-b border-slate-800 pb-3">
            <span id="ex-number" class="text-xs font-mono font-bold text-emerald-400 uppercase tracking-widest">ESERCIZIO 1 DE 13</span>
            <h2 id="ex-name" class="text-2xl font-black text-white mt-0.5">Skip ginocchia alte</h2>
            <p id="ex-details" class="text-sm font-semibold text-slate-300 mt-1">3 serie x 1' • Recupero 90s</p>
            <p id="ex-note" class="text-xs text-amber-400/90 mt-1 italic hidden"></p>
          </div>

          <!-- 2. VIDEO YOUTUBE IN APP -->
          <div id="youtube-container" class="aspect-video w-full bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
            <iframe id="youtube-iframe" class="w-full h-full" src="" title="Video Tutorial" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>

          <!-- 3. TIMER DISPLAY (ROSSO=LAVORO, VERDE=RIPOSO) -->
          <div id="timer-box" class="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-center space-y-1">
            <span id="timer-label" class="text-3xs font-mono text-slate-400 uppercase">PRONTO</span>
            <div id="timer-display" class="text-5xl font-black font-mono text-slate-200">00:00</div>
          </div>
        </div>

        <!-- 4. PULSANTE PRINCIPALE "VIA" / "FATTO" / "PROSSIMO" -->
        <div class="pt-2">
          <button id="main-action-btn" onclick="handleMainAction()" class="w-full py-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider">
            VIA
          </button>
        </div>

      </div>

      <!-- SCHERMATA 3: FINE WORKOUT & CHAT -->
      <div id="screen-summary" class="hidden space-y-4 py-6">
        <h2 class="font-black text-2xl text-emerald-400 text-center">SESSIONE COMPLETATA! 🎉</h2>
        
        <div class="p-4 bg-slate-800/40 border border-slate-800 rounded-2xl space-y-2">
          <label class="text-xs font-bold text-slate-300 uppercase">Note Allenamento:</label>
          <textarea id="workout-notes" placeholder="Sensazioni, fatica..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white outline-none h-20 focus:border-emerald-500"></textarea>
        </div>

        <button onclick="finishWorkoutAndSend()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base rounded-xl">
          💾 SALVA SU GOOGLE SHEETS & IA
        </button>

        <div id="ai-chat-box" class="hidden space-y-3 pt-2">
          <div class="p-4 bg-slate-900 border border-emerald-500/30 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="font-bold text-xs text-emerald-400">🤖 GEMINI COACH IA</span>
              <span id="chat-status" class="text-3xs text-slate-400">In ascolto...</span>
            </div>
            <div id="chat-messages" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-200"></div>
            <div class="flex gap-2 pt-2">
              <input type="text" id="chat-input" placeholder="Chiedi al coach..." class="flex-1 bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs text-white outline-none focus:border-emerald-500">
              <button onclick="sendChatMessage()" class="px-3 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Invia</button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- FRECCE DI NAVIGAZIONE IN CALCE -->
    <footer id="footer-nav" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 p-3 flex justify-between items-center backdrop-blur">
      <button onclick="prevExercise()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1">
        ← Precedente
      </button>
      <button onclick="nextExercise()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1">
        Successivo →
      </button>
    </footer>

  </div>

  <script>
    const GOOGLE_SHEET_URL = "INCOLLA_QUI_IL_TUO_URL_DI_GOOGLE"; 
    const GEMINI_API_KEY = "INCOLLA_QUI_LA_TUA_GEMINI_API_KEY";

    function getEmbedUrl(videoId, autoplay = false) {
      if (!videoId || videoId.startsWith("ID_")) return "";
      return `https://www.youtube.com/embed/${videoId}${autoplay ? '?autoplay=1' : ''}`;
    }

    // Struttura Dati Routine
    const routineData = [
      { name: "1. Skip ginocchia alte", target: "3 serie x 1'", totalSets: 3, isTimer: true, workTime: 60, restTime: 90, videoId: "ID_SKIP" },
      { name: "1. Squat rana", target: "3 serie x 10-14 reps", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_SQUAT_RANA" },
      { name: "1. Montagna -> Stretching", target: "3 serie x 3-5 per lato", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_MONTAGNA" },
      { name: "2. Jumping Jacks", target: "3 serie x 1'", totalSets: 3, isTimer: true, workTime: 60, restTime: 90, videoId: "ID_JUMPING" },
      { name: "2. Affondi alternati indietro", target: "3 serie x 8-16 per lato", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_AFFONDI" },
      { name: "2. Piegamenti stretti / Thruster", target: "3 serie x 5-9 reps", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_PIEGAMENTI" },
      { name: "2. Crunch gambe tese", target: "3 serie x 15-25 reps", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_CRUNCH" },
      { 
        name: "3. Squat: Moby - Flower", 
        target: "1 volta (Bring Sally Up)", 
        totalSets: 1, 
        isTimer: false, 
        restTime: 90, 
        videoId: "6A2V9Bu80J4", 
        autoplay: true,
        note: "'Bring Sally Down' -> Scendi | 'Bring Sally Up' -> Sali." 
      },
      { name: "4. Mountain climber", target: "3 serie x 1'", totalSets: 3, isTimer: true, workTime: 60, restTime: 90, videoId: "ID_MOUNTAIN" },
      { name: "4. Trazioni facilitata / Rematore", target: "3 serie x 10-15 reps", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_TRAZIONI" },
      { name: "4. Criss Cross", target: "3 serie x 6-10 per lato", totalSets: 3, isTimer: false, restTime: 90, videoId: "ID_CRISS_CROSS" },
      { 
        name: "5. Piegamenti braccia - EMOM", 
        target: "10 serie x 1' (3-4 reps/min)", 
        totalSets: 10, 
        isTimer: true, 
        workTime: 60, 
        restTime: 0, 
        videoId: "ID_EMOM",
        note: "EMOM: Fai le rep all'inizio di ogni minuto." 
      },
      { name: "6. Stretching: Cane basso & alto", target: "3 serie x 3 (10'' tenuta)", totalSets: 3, isTimer: false, restTime: 60, videoId: "ID_STRETCHING" }
    ];

    let currentIndex = 0;
    let currentSet = 1;
    let mainTimer = null;
    let audioCtx = null;
    let state = "IDLE"; // IDLE, WORKING, RESTING

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 600, duration = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playTripleBeep() {
      playBeep(900, 0.12);
      setTimeout(() => playBeep(900, 0.12), 200);
      setTimeout(() => playBeep(1100, 0.25), 400);
    }

    function startWorkout() {
      initAudio();
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-workout').classList.remove('hidden');
      document.getElementById('footer-nav').classList.remove('hidden');
      currentIndex = 0;
      loadExercise();
    }

    function loadExercise() {
      clearInterval(mainTimer);
      state = "IDLE";
      currentSet = 1;
      const ex = routineData[currentIndex];

      document.getElementById('ex-number').textContent = `ESERCIZIO ${currentIndex + 1} DE ${routineData.length}`;
      document.getElementById('ex-name').textContent = ex.name;
      document.getElementById('ex-details').textContent = `${ex.target} (Serie 1 di ${ex.totalSets})`;
      
      const noteEl = document.getElementById('ex-note');
      if (ex.note) {
        noteEl.textContent = ex.note;
        noteEl.classList.remove('hidden');
      } else {
        noteEl.classList.add('hidden');
      }

      // Video YouTube Embed
      const iframe = document.getElementById('youtube-iframe');
      if (ex.videoId && !ex.videoId.startsWith("ID_")) {
        iframe.src = getEmbedUrl(ex.videoId, ex.autoplay || false);
        document.getElementById('youtube-container').classList.remove('hidden');
      } else {
        iframe.src = "";
        document.getElementById('youtube-container').classList.add('hidden');
      }

      // Reset Timer Display & Main Button
      const timerDisplay = document.getElementById('timer-display');
      const timerLabel = document.getElementById('timer-label');
      const actionBtn = document.getElementById('main-action-btn');

      timerDisplay.className = "text-5xl font-black font-mono text-slate-200";
      timerLabel.textContent = "PRONTO";
      
      if (ex.isTimer) {
        timerDisplay.textContent = formatTime(ex.workTime);
      } else {
        timerDisplay.textContent = "00:00";
      }

      actionBtn.textContent = "VIA";
      actionBtn.className = "w-full py-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider";
    }

    function handleMainAction() {
      initAudio();
      const ex = routineData[currentIndex];

      if (state === "IDLE") {
        if (ex.isTimer) {
          // Esercizio a Tempo -> Avvia Timer Rosso
          startWorkTimer(ex.workTime);
        } else {
          // Esercizio a Reps -> Pulsante diventa FATTO
          state = "WORKING";
          const actionBtn = document.getElementById('main-action-btn');
          actionBtn.textContent = "FATTO";
          actionBtn.className = "w-full py-5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg uppercase tracking-wider";
        }
      } 
      else if (state === "WORKING" && !ex.isTimer) {
        // Premuto FATTO -> Fai partire riposo Verde
        startRestTimer(ex.restTime);
      }
      else if (state === "FINISHED_EXERCISE") {
        nextExercise();
      }
    }

    function startWorkTimer(seconds) {
      state = "WORKING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "TEMPO ESERCIZIO";
      display.className = "text-5xl font-black font-mono text-red-500 animate-pulse";
      btn.textContent = "IN ESECUZIONE...";
      btn.className = "w-full py-5 bg-slate-800 text-slate-500 font-black text-xl rounded-2xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(700, 0.12);
        
        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          // Passa in automatico al riposo verde
          startRestTimer(routineData[currentIndex].restTime);
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function startRestTimer(seconds) {
      if (seconds <= 0) {
        advanceSetOrExercise();
        return;
      }

      state = "RESTING";
      clearInterval(mainTimer);
      let time = seconds;

      const display = document.getElementById('timer-display');
      const label = document.getElementById('timer-label');
      const btn = document.getElementById('main-action-btn');

      label.textContent = "RECUPERO";
      display.className = "text-5xl font-black font-mono text-emerald-400";
      btn.textContent = "RIPOSO IN CORSO...";
      btn.className = "w-full py-5 bg-slate-800 text-slate-500 font-black text-xl rounded-2xl cursor-not-allowed uppercase tracking-wider";

      const update = () => {
        display.textContent = formatTime(time);
        if (time <= 5 && time > 0) playBeep(600, 0.12);

        if (time <= 0) {
          clearInterval(mainTimer);
          playTripleBeep();
          advanceSetOrExercise();
        } else {
          time--;
        }
      };

      update();
      mainTimer = setInterval(update, 1000);
    }

    function advanceSetOrExercise() {
      const ex = routineData[currentIndex];
      
      if (currentSet < ex.totalSets) {
        currentSet++;
        state = "IDLE";
        document.getElementById('ex-details').textContent = `${ex.target} (Serie ${currentSet} di ${ex.totalSets})`;
        
        const btn = document.getElementById('main-action-btn');
        btn.textContent = "VIA";
        btn.className = "w-full py-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg shadow-emerald-500/10 uppercase tracking-wider";
        
        const display = document.getElementById('timer-display');
        display.className = "text-5xl font-black font-mono text-slate-200";
        display.textContent = ex.isTimer ? formatTime(ex.workTime) : "00:00";
        document.getElementById('timer-label').textContent = "PRONTO";
      } else {
        // Fine tutte le serie dell'esercizio
        state = "FINISHED_EXERCISE";
        const btn = document.getElementById('main-action-btn');
        btn.textContent = "PROSSIMO ESERCIZIO";
        btn.className = "w-full py-5 bg-blue-500 hover:bg-blue-400 text-slate-950 font-black text-xl rounded-2xl transition shadow-lg uppercase tracking-wider";
      }
    }

    function nextExercise() {
      if (currentIndex < routineData.length - 1) {
        currentIndex++;
        loadExercise();
      } else {
        // Fine Scheda -> Vai a Summary
        document.getElementById('screen-workout').classList.add('hidden');
        document.getElementById('footer-nav').classList.add('hidden');
        document.getElementById('screen-summary').classList.remove('hidden');
      }
    }

    function prevExercise() {
      if (currentIndex > 0) {
        currentIndex--;
        loadExercise();
      }
    }

    function formatTime(sec) {
      let m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // Chat Gemini IA Finale
    function finishWorkoutAndSend() {
      const notes = document.getElementById('workout-notes').value;

      if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("http")) {
        fetch(GOOGLE_SHEET_URL, {
          method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ action: "FINISH", routine: "CHALLENGE", notes: notes })
        }).catch(err => console.log(err));
      }

      document.getElementById('ai-chat-box').classList.remove('hidden');
      initAIChat(notes);
    }

    async function initAIChat(notes) {
      const prompt = `Ho appena completato la scheda Challenge. Note: ${notes || "Nessuna"}. Proponi aggiustamenti per la prossima volta.`;
      addChatMessage("IA", "Sto analizzando l'allenamento...");
      callGemini(prompt);
    }

    async function callGemini(userText) {
      const statusEl = document.getElementById('chat-status');
      statusEl.textContent = "Gemini sta pensando...";

      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("INCOLLA")) {
        statusEl.textContent = "Chiave Mancante";
        addChatMessage("IA", "⚠️ Inserisci la tua GEMINI_API_KEY per abilitare la chat.");
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: userText }] }] })
        });
        const data = await response.json();
        const aiReply = data.candidates[0].content.parts[0].text;
        statusEl.textContent = "In ascolto...";
        addChatMessage("IA", aiReply);
      } catch (e) {
        statusEl.textContent = "Errore Connessione";
        addChatMessage("IA", "❌ Errore di connessione con Gemini.");
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      addChatMessage("TU", text);
      input.value = "";
      callGemini(text);
    }

    function addChatMessage(sender, text) {
      const box = document.getElementById('chat-messages');
      const isUser = sender === "TU";
      box.innerHTML += `
        <div class="p-2.5 rounded-xl text-xs ${isUser ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 self-end ml-4' : 'bg-slate-800 text-slate-200 mr-4'}">
          <strong>${sender}:</strong> <span class="whitespace-pre-line">${text}</span>
        </div>
      `;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
</html>
